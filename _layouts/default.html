<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#a4bcab">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CORREÇÃO AQUI: Usando o baseurl dinâmico -->
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
</head>
<body>

    <header id="header" role="banner" aria-label="Menu de navegação principal">
        <nav class="container" aria-label="Navegação primária">
            <a href="{{ site.baseurl }}/" class="logo-link">
                <!-- CORREÇÃO AQUI: Imagens com baseurl -->
                <img src="{{ site.baseurl }}/assets/KF-Logomarca-d-agua-retangular.png" alt="Logotipo Kriscieli" class="logo-full">
            </a>
            
            <ul class="nav-links" id="nav-links" role="menubar">
                <li><a href="{{ site.baseurl }}/#sobre">Sobre</a></li>
                <li><a href="{{ site.baseurl }}/#servicos">Serviços</a></li>
                <li><a href="{{ site.baseurl }}/#diferenciais">Diferenciais</a></li>
                <li><a href="{{ site.baseurl }}/#contato">Contato</a></li>
                <li><a href="{{ site.baseurl }}/blog">Blog</a></li>
            </ul>

            <button class="hamburger" id="hamburger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer role="contentinfo">
        <div class="container footer-content">
            <p>&copy; 2026 Kriscieli Fonsaca. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Ícones Flutuantes (Copie seus SVGs aqui) -->
    <a href="https://wa.me/5541997943221" class="whatsapp-float" target="_blank">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="white">... (coloque o seu SVG aqui) ...</svg>
    </a>
    
    <button id="back-to-top" class="back-to-top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">... (coloque o seu SVG aqui) ...</svg>
    </button>

    <!-- CORREÇÃO AQUI: Script com baseurl -->
    <script src="{{ site.baseurl }}/script.js"></script>
</body>
</html>
