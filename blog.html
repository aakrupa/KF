---
layout: default
title: Blog
---

<section class="section-padding bg-light">
    <div class="container">
        <div class="section-header">
            <h1>Blog da Kriscieli</h1>
            <p>Dicas sobre neuropsicologia, inclusão e desenvolvimento.</p>
        </div>

        <div class="servicos-grid">
            {% for post in site.posts %}
            <article class="card">
                <h3><a href="{{ site.baseurl }}{{ post.url }}" style="color: var(--text-dark); text-decoration: none;">{{ post.title }}</a></h3>
                <small>Publicado em {{ post.date | date: "%d/%m/%Y" }}</small>
                <p>{{ post.excerpt | strip_html | truncate: 150 }}</p>
                <a href="{{ site.baseurl }}{{ post.url }}" class="btn-primary" style="padding: 0.5rem 1.5rem; font-size: 0.875rem; margin-top: 1rem;">Ler mais</a>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
